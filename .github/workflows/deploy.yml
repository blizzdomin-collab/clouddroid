name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "=== Starting deployment ==="
            cd /var/www/clouddroid

            echo "[1] Pulling latest code..."
            git config --global --add safe.directory /var/www/clouddroid
            sudo -n chown -R $USER:$USER /var/www/clouddroid || true
            git fetch origin
            git reset --hard origin/main

            echo "[2] Installing dependencies..."
            npm install --production=false

            echo "[2b] Ensuring Redis is available..."
            if ! command -v redis-server >/dev/null 2>&1; then
              echo "Redis not found. Install it manually on VPS or enable passwordless sudo for deploy user."
            fi
            if command -v systemctl >/dev/null 2>&1; then
              sudo -n systemctl enable redis-server || true
              sudo -n systemctl restart redis-server || true
            fi

            echo "[3] Cleaning old build artifacts..."
            rm -rf dist
            rm -rf .astro

            echo "[4] Building..."
            npm run build

            echo "[5] Verifying build output..."
            if [ ! -f "dist/server/entry.mjs" ]; then
              echo "ERROR: Build failed - dist/server/entry.mjs not found"
              exit 1
            fi

            echo "[6] Ensuring data directory exists..."
            mkdir -p .data

            echo "[7] Restarting app..."
            pm2 reload deploy/ecosystem.config.cjs --update-env || pm2 start deploy/ecosystem.config.cjs
            pm2 save

            echo "=== Waiting for PM2 to stabilize..."
            sleep 5

            echo "=== Verifying PM2 status..."
            pm2 status

            echo "=== Deployment complete ==="
