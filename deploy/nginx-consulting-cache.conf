# Nginx cache headers for consulting.clouddroid.eu
#
# Drop this into your existing server { } block for the consulting subdomain.
# It sets proper Cache-Control headers so browsers always revalidate HTML
# (and therefore always pick up the new ?v=<build-id> query string) but
# can still cache fonts, images, and other static assets for a year.

# HTML: must always revalidate (so build-id cache-bust kicks in)
location ~* \.html$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires 0;
}

# CSS/JS without ?v= query string: short cache, must revalidate
location ~* ^/(css|js)/.+\.(css|js)$ {
    add_header Cache-Control "no-cache, must-revalidate" always;
    expires 0;
}

# Manifest + favicons + images: long cache (1 year)
location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    expires 1y;
}

# Sitemap and robots
location = /sitemap.xml {
    add_header Cache-Control "public, max-age=3600" always;
    expires 1h;
}
location = /robots.txt {
    add_header Cache-Control "public, max-age=86400" always;
    expires 24h;
}

# Service worker itself: never cache (so deploys immediately take effect)
location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires off;
}
